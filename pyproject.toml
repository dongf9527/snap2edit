[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snap2edit"
version = "0.3.0"
description = "Snap2Edit 截图复刻引擎 —— 一份布局规格，同步产出全可编辑的 HTML+SVG 与原生 PPTX"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Snap2Edit Contributors" }]
keywords = ["svg", "pptx", "chart", "diagram", "reconstruction", "html", "editable"]
dependencies = [
  "python-pptx>=0.6.21",
  "Pillow>=9.0",
  "numpy>=1.21",
  "PyYAML>=5.4",
]

[project.optional-dependencies]
verify = ["playwright>=1.30"]

[project.scripts]
snap2edit = "snap2edit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
