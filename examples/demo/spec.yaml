  bg: "#F7F9FC"
  card: "#FFFFFF"
  card_border: "#D8E0EA"
  primary: "#16233B"
  body: "#3A4A5E"
  muted: "#8A97A8"
  accent: "#2B6CB0"
texts:
  - "企业AI落地四步法（Demo 示例）"
