  - {id: ic-doc, type: icon, x: 784, y: 550, w: 72, h: 72, name: "doc", fill: "#2F855A"}
  - {id: ic-user, type: icon, x: 904, y: 550, w: 72, h: 72, name: "user", fill: "#6B46C1"}
  - {id: ic-check, type: icon, x: 1024, y: 550, w: 72, h: 72, name: "check", fill: "#2F855A"}
  - {id: ic-target, type: icon, x: 1144, y: 550, w: 72, h: 72, name: "target", fill: "#6B46C1"}
