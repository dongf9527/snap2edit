# Docs · MkDocs Material 文档站 → GitHub Pages
# 触发：docs/、mkdocs.yml 或 README.md 变更推到 main；支持手动触发。
# 一次性配置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 docs extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: strict 构建（告警即失败）
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
