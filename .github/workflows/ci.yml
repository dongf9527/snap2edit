# CI · 引擎测试矩阵 + 打包校验 + Web 测试
# 触发：push 到 main / 所有 PR
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) 引擎单测：Python 3.9 / 3.11 / 3.13 三档矩阵
  #    3.9 档固定 ubuntu-22.04：ubuntu-latest 已是 26.04，python-versions 不再提供 3.9
  #    矩阵安装 chromium：门4 两条真实浏览器集成测试实跑（未装时测试侧按 D5 跳过）
  engine-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", os: ubuntu-22.04 }
          - { python: "3.11", os: ubuntu-latest }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装引擎 + 测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[verify]" pytest pytest-cov
      - name: 安装 chromium（门4 截图门实跑）
        run: python -m playwright install --with-deps chromium
      - name: 运行引擎测试（覆盖率门槛 ≥ 80%，PRD v1.0 验收线）
        run: pytest tests/ --cov=snap2edit --cov-report=term --cov-fail-under=80

  # 2) 打包校验：sdist + wheel 构建并过 twine check（发布前的门）
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建双制品
        run: |
          python -m pip install build twine
          python -m build --sdist --wheel
      - name: twine check
        run: python -m twine check dist/*

  # 3) Web 全链路：单测 + tsc + next build
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Web 单测
        run: npm test
      - name: 类型检查 + 构建
        run: npm run build
