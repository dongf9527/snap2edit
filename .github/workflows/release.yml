# Release · tag 推送 → 构建 → PyPI 发布（Trusted Publishing）→ GitHub Release
#
# 前置一次性配置（二选一）：
#   A. Trusted Publishing（推荐，无 token）：
#      PyPI 项目页 → Publishing → 添加 pending publisher：
#        owner = dongf9527, repository = snap2edit, workflow = release.yml
#      （项目尚不存在时，首次发布将自动建项并绑定）
#   B. API Token：仓库 Settings → Secrets → Actions → 新增 PYPI_API_TOKEN，
#      并取消下方 password 两行注释、删除 id-token/attestations 相关行。
#
# 发布：git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # 创建 GitHub Release 并挂附件
  id-token: write        # PyPI Trusted Publishing（OIDC）

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建双制品
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel
      - name: twine check（不通过则中止发布）
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # API Token 方式改用：
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 创建 GitHub Release 并挂载双制品
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
